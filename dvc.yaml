stages:
  data_sync:
    cmd: python3 -m src.data --mode minimal
    deps:
      - src/data.py
      - src/config.yaml
    outs:
      - .data/interim/adserp_consolidated.parquet:
          cache: false

  train_foundation:
    cmd: python3 -m src.training --mode minimal
    deps:
      - src/training.py
      - src/preprocessing.py
      - src/target_generation.py
      - src/config.yaml
      - .data/interim/adserp_consolidated.parquet
    outs:
      - models/foundational_gru.pth

  fine_tune_ablation:
    cmd: python3 -c "import sys; sys.path.insert(0, 'src'); import training; training.run_ablation_suite()"
    deps:
      - src/training.py
      - models/foundational_gru.pth

  export:
    cmd: python3 -m src.export --model-path models/foundational_gru.pth --output-dir models
    deps:
      - src/export.py
      - models/foundational_gru.pth
    outs:
      - models/model.onnx
      - models/model_int8.onnx
