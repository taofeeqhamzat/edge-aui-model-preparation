stages:
  canonicalize:
    cmd: python3 -m src.data --canonicalize adserp
    deps:
      - src/data.py
      - src/config.yaml
    outs:
      - .data/canonical/adserp/data.parquet:
          cache: false

  extract_microtensors:
    cmd: python3 -m src.microtensor_store --canonical-path .data/canonical/adserp/data.parquet --output-path .data/interim/microtensors/adserp_microtensors.parquet
    deps:
      - src/microtensor_store.py
      - src/preprocessing.py
      - src/target_generation.py
      - .data/canonical/adserp/data.parquet
    outs:
      - .data/interim/microtensors/adserp_microtensors.parquet:
          cache: false

  train_foundation:
    cmd: python3 -m src.training --epochs 5
    deps:
      - src/training.py
      - src/preprocessing.py
      - src/target_generation.py
      - src/microtensor_store.py
      - src/config.yaml
      - .data/interim/microtensors/adserp_microtensors.parquet
    outs:
      - models/foundational_gru.pth

  fine_tune_ablation:
    cmd: python3 -c "import sys; sys.path.insert(0, 'src'); import training; training.run_ablation_suite()"
    deps:
      - src/training.py
      - models/foundational_gru.pth

  export:
    cmd: python3 -m src.export --model-path models/foundational_gru.pth --output-dir models
    deps:
      - src/export.py
      - models/foundational_gru.pth
    outs:
      - models/model.onnx
      - models/model_int8.onnx
